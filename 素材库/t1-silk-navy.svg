<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="presentation">
  <defs>
    <linearGradient id="thr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#05090F" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#BF8A54" stop-opacity="0.30"/>
      <stop offset="0.58" stop-color="#BF8A54" stop-opacity="0.30"/>
      <stop offset="1"   stop-color="#05090F" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="weave" width="7" height="9" patternUnits="userSpaceOnUse">
      <rect width="7" height="9" fill="#131E2C"/>
      <rect width="7" height="9" fill="url(#thr)"/>
      <rect y="0" width="7" height="1" fill="#05090F" opacity="0.30"/>
      <rect y="4.5" width="7" height="0.8" fill="#BF8A54" opacity="0.10"/>
    </pattern>
    <filter id="warp" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0012 0.0035" numOctaves="3" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#131E2C"/>
  <g filter="url(#warp)" opacity="0.85">
    <rect width="1600" height="900" fill="url(#weave)"/>
  </g>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
